<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurnitureERP - Sales Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">F</div>
                <h1>FurnitureERP</h1>
                <p>Sales & Expense Tracker</p>
            </div>
            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required autocomplete="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="Enter password">
                </div>
                <div id="login-error" class="error-msg" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
            </form>
            <div class="login-footer">
                <p>Currency: Omani Rial (OMR)</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon-sm">F</div>
                <span class="sidebar-title">FurnitureERP</span>
                <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
            </div>
            <div class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                    <span class="nav-icon">&#9632;</span> Dashboard
                </a>
                <a href="#" class="nav-item" data-page="sales" onclick="navigate('sales')">
                    <span class="nav-icon">&#9650;</span> Sales
                </a>
                <a href="#" class="nav-item" data-page="expenses" onclick="navigate('expenses')">
                    <span class="nav-icon">&#9660;</span> Expenses
                </a>
                <a href="#" class="nav-item" data-page="inventory" onclick="navigate('inventory')">
                    <span class="nav-icon">&#9638;</span> Inventory
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item owner-only" data-page="reports" onclick="navigate('reports')" style="display:none">
                    <span class="nav-icon">&#9776;</span> Reports
                </a>
                <a href="#" class="nav-item owner-only" data-page="audit" onclick="navigate('audit')" style="display:none">
                    <span class="nav-icon">&#9881;</span> Audit Log
                </a>
                <a href="#" class="nav-item owner-only" data-page="users" onclick="navigate('users')" style="display:none">
                    <span class="nav-icon">&#9787;</span> Users
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <div id="user-fullname" class="user-name">User</div>
                        <div id="user-role" class="user-role-badge">employee</div>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline" onclick="handleLogout()">Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
                <h2 id="page-title">Dashboard</h2>
                <div class="top-bar-right">
                    <span id="current-date" class="date-display"></span>
                </div>
            </header>
            <div id="page-content" class="page-content">
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
