/* ==============================================================================
   FurnitureERP - Odoo-inspired ERP Theme
   ============================================================================== */

:root {
    --primary: #714B67;
    --primary-dark: #5B3A52;
    --primary-light: #8E6B82;
    --accent: #00A09D;
    --accent-light: #E0F5F5;
    --success: #28a745;
    --warning: #F59E0B;
    --danger: #DC3545;
    --info: #17a2b8;
    --bg: #F0F0F0;
    --bg-white: #FFFFFF;
    --text: #2C2C2C;
    --text-muted: #6B7280;
    --border: #D1D5DB;
    --sidebar-width: 240px;
    --header-height: 50px;
    --shadow: 0 1px 3px rgba(0,0,0,0.12);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
    --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
}

.app-layout { display: flex; min-height: 100vh; }

.sidebar {
    width: var(--sidebar-width); background: var(--primary); color: #fff;
    position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s;
}
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--primary-light); display: flex; align-items: center; gap: 10px; }
.sidebar-header .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.sidebar-header .logo span { color: var(--accent); }
.sidebar-nav { padding: 8px 0; }
.nav-section { padding: 12px 20px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 20px; color: rgba(255,255,255,0.85); cursor: pointer; transition: all 0.15s; text-decoration: none; font-size: 13.5px; }
.nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; border-right: 3px solid var(--accent); }
.nav-item .icon { width: 20px; text-align: center; font-size: 16px; }
.main-area { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; }

.top-header { height: var(--header-height); background: var(--bg-white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
.header-left { display: flex; align-items: center; gap: 16px; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); }
.breadcrumb .current { color: var(--text); font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 12px; }
.search-box { position: relative; }
.search-box input { padding: 6px 12px 6px 32px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; width: 220px; outline: none; transition: border-color 0.2s; }
.search-box input:focus { border-color: var(--primary); }
.search-box .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

.content-area { padding: 20px 24px; flex: 1; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 700; color: var(--text); }
.page-actions { display: flex; gap: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border: 1px solid transparent; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { opacity: 0.9; }
.btn-warning { background: var(--warning); color: #fff; }

.card { background: var(--bg-white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.card-body { padding: 18px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--bg-white); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); border: 1px solid var(--border); border-left: 4px solid var(--primary); }
.stat-card.accent { border-left-color: var(--accent); }
.stat-card.success { border-left-color: var(--success); }
.stat-card.warning { border-left-color: var(--warning); }
.stat-card.danger { border-left-color: var(--danger); }
.stat-card.info { border-left-color: var(--info); }
.stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
table th { background: #F9FAFB; padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); }
table td { padding: 10px 14px; border-bottom: 1px solid #F3F4F6; font-size: 13.5px; }
table tr:hover { background: #F9FAFB; }
table tr { cursor: pointer; }

.badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; text-transform: capitalize; }
.badge-new, .badge-draft { background: #E5E7EB; color: #374151; }
.badge-qualified, .badge-confirmed, .badge-sent { background: #DBEAFE; color: #1E40AF; }
.badge-proposition, .badge-in_progress, .badge-sending, .badge-scheduled { background: #FEF3C7; color: #92400E; }
.badge-won, .badge-paid, .badge-done, .badge-received, .badge-completed, .badge-delivered { background: #D1FAE5; color: #065F46; }
.badge-lost, .badge-cancelled, .badge-overdue { background: #FEE2E2; color: #991B1B; }
.badge-invoiced { background: #E0E7FF; color: #3730A3; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.2s; }
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal { background: var(--bg-white); border-radius: 8px; box-shadow: var(--shadow-lg); width: 90%; max-width: 640px; max-height: 85vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.2s; }
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); padding: 4px; line-height: 1; }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; outline: none; transition: border-color 0.2s; font-family: inherit; }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(113, 75, 103, 0.1); }
textarea.form-control { min-height: 80px; resize: vertical; }
select.form-control { appearance: auto; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
.kanban-column { min-width: 270px; flex: 1; background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border); }
.kanban-column-header { padding: 12px 14px; font-weight: 600; font-size: 13.5px; border-bottom: 1px solid var(--border); background: #F9FAFB; border-radius: var(--radius) var(--radius) 0 0; display: flex; align-items: center; justify-content: space-between; }
.kanban-column-header .count { background: var(--primary); color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 10px; }
.kanban-cards { padding: 10px; min-height: 100px; }
.kanban-card { background: var(--bg-white); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: box-shadow 0.15s; }
.kanban-card:hover { box-shadow: var(--shadow-lg); }
.kanban-card-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.kanban-card-sub { font-size: 12px; color: var(--text-muted); }
.kanban-card-amount { font-size: 15px; font-weight: 700; color: var(--primary); margin-top: 6px; }

.pos-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; height: calc(100vh - var(--header-height) - 90px); }
.pos-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; padding: 4px; }
.pos-product-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; cursor: pointer; transition: all 0.15s; }
.pos-product-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); }
.pos-product-icon { font-size: 32px; margin-bottom: 6px; }
.pos-product-name { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
.pos-product-price { font-size: 14px; font-weight: 700; color: var(--primary); }
.pos-cart { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; }
.pos-cart-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; }
.pos-cart-items { flex: 1; overflow-y: auto; padding: 8px 0; }
.pos-cart-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #F3F4F6; }
.pos-cart-item-info { flex: 1; }
.pos-cart-item-name { font-weight: 500; font-size: 13px; }
.pos-cart-item-price { font-size: 12px; color: var(--text-muted); }
.pos-cart-item-qty { display: flex; align-items: center; gap: 6px; }
.pos-cart-item-qty button { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.pos-cart-item-subtotal { font-weight: 600; min-width: 70px; text-align: right; font-size: 13px; }
.pos-cart-footer { border-top: 2px solid var(--border); padding: 14px 16px; }
.pos-totals-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
.pos-totals-row.total { font-size: 18px; font-weight: 700; color: var(--primary); padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--border); }
.pos-payment-buttons { display: flex; gap: 8px; margin-top: 12px; }
.pos-payment-buttons .btn { flex: 1; justify-content: center; }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 18px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.detail-field { margin-bottom: 12px; }
.detail-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-value { font-size: 14px; font-weight: 500; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 15px; }

.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #333; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 13.5px; box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; max-width: 350px; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-area { margin-left: 0; }
    .pos-layout { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
}

@media print {
    .sidebar, .top-header, .page-actions, .modal-overlay { display: none !important; }
    .main-area { margin-left: 0; }
    .content-area { padding: 0; }
}

.email-preview { background: #f9f9f9; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 8px; min-height: 120px; }
.sms-char-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px; }

.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.text-muted { color: var(--text-muted); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-primary { color: var(--primary); }
.fw-bold { font-weight: 600; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.gap-2 { gap: 8px; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }

    </style>
</head>

// ── Utilities ────────────────────────────────────────────────────────────────

function toast(msg, type='success') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function openModal(title, bodyHtml, footerHtml='') {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-footer').innerHTML = footerHtml;
    document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
}

function badge(status) {
    return '<span class="badge badge-' + status + '">' + status.replace('_', ' ') + '</span>';
}

function orderTotal(lines) {
    return lines.reduce((s, l) => s + l.qty * l.price, 0);
}

let currentPage = 'dashboard';

function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const navItem = document.querySelector('.nav-item[data-page="'+page+'"]');
    if (navItem) navItem.classList.add('active');
    const names = {dashboard:'Dashboard',crm:'CRM',sales:'Sales',pos:'Point of Sale',inventory:'Inventory',purchase:'Purchase',manufacturing:'Manufacturing',accounting:'Accounting','email-marketing':'Email Marketing','sms-marketing':'SMS Marketing',contacts:'Contacts',products:'Products'};
    document.getElementById('breadcrumb-page').textContent = names[page] || page;
    const renderer = {
        dashboard: renderDashboard, crm: renderCRM, sales: renderSales, pos: renderPOS,
        inventory: renderInventory, purchase: renderPurchase, manufacturing: renderManufacturing,
        accounting: renderAccounting, 'email-marketing': renderEmailMarketing,
        'sms-marketing': renderSMSMarketing, contacts: renderContacts, products: renderProducts
    };
    if (renderer[page]) renderer[page]();
}

    const totalProducts = DB.products.length;

function renderCRM() {
    const stages = ['new','qualified','proposition','won','lost'];
    const stageNames = {new:'New',qualified:'Qualified',proposition:'Proposition',won:'Won',lost:'Lost'};
    let html = `<div class="page-header"><h1 class="page-title">CRM Pipeline</h1><div class="page-actions"><button class="btn btn-primary" onclick="newLeadForm()">+ New Lead</button></div></div>`;
    html += '<div class="kanban-board">';
    stages.forEach(stage => {
        const cards = DB.leads.filter(l => l.stage === stage);
        html += `<div class="kanban-column"><div class="kanban-column-header">${stageNames[stage]} <span class="count">${cards.length}</span></div><div class="kanban-cards">`;
        cards.forEach(l => {
            html += `<div class="kanban-card" onclick="viewLead(${l.id})"><div class="kanban-card-title">${l.name}</div><div class="kanban-card-sub">${l.email}</div><div class="kanban-card-amount">${money(l.expected_revenue)}</div></div>`;
        });
        html += '</div></div>';
    });
    html += '</div>';
    document.getElementById('content').innerHTML = html;
}

function viewLead(id) {
    const l = DB.leads.find(x => x.id === id);
    if (!l) return;
    const stages = ['new','qualified','proposition','won','lost'];
    const stageOptions = stages.map(s => `<option value="${s}" ${l.stage===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
    openModal(l.name, `
        <div class="detail-grid">
            <div><div class="detail-field"><div class="detail-label">Contact</div><div class="detail-value">${l.email}</div></div>
                <div class="detail-field"><div class="detail-label">Phone</div><div class="detail-value">${l.phone||'-'}</div></div>
                <div class="detail-field"><div class="detail-label">Expected Revenue</div><div class="detail-value">${money(l.expected_revenue)}</div></div></div>
            <div><div class="detail-field"><div class="detail-label">Stage</div><div class="detail-value"><select class="form-control" id="lead-stage">${stageOptions}</select></div></div>
                <div class="detail-field"><div class="detail-label">Probability</div><div class="detail-value">${l.probability}%</div></div>
                <div class="detail-field"><div class="detail-label">Created</div><div class="detail-value">${l.created_at}</div></div></div>
        </div>
        <hr class="divider"><div class="detail-field"><div class="detail-label">Notes</div><div class="detail-value">${l.notes||'-'}</div></div>
    `, `<button class="btn btn-primary" onclick="updateLeadStage(${l.id})">Update Stage</button><button class="btn btn-outline" onclick="closeModal()">Close</button>`);
}

function updateLeadStage(id) {
    const l = DB.leads.find(x => x.id === id);
    if (!l) return;
    l.stage = document.getElementById('lead-stage').value;
    if (l.stage === 'won') l.probability = 100;
    if (l.stage === 'lost') l.probability = 0;
    closeModal();
    toast('Lead stage updated');
    renderCRM();
}

function newLeadForm() {
    const contactOpts = DB.contacts.filter(c=>c.is_customer).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    openModal('New Lead', `
        <div class="form-group"><label>Lead Name</label><input class="form-control" id="lead-name" placeholder="e.g. Office Renovation"></div>
        <div class="form-group"><label>Contact</label><select class="form-control" id="lead-contact"><option value="">Select...</option>${contactOpts}</select></div>
        <div class="form-row">
            <div class="form-group"><label>Expected Revenue</label><input class="form-control" id="lead-revenue" type="number" placeholder="0.00"></div>
            <div class="form-group"><label>Probability %</label><input class="form-control" id="lead-prob" type="number" value="20"></div>
        </div>
        <div class="form-group"><label>Notes</label><textarea class="form-control" id="lead-notes"></textarea></div>
    `, '<button class="btn btn-primary" onclick="saveLead()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function saveLead() {
    const name = document.getElementById('lead-name').value.trim();
    if (!name) { toast('Name is required','error'); return; }
    const contactId = parseInt(document.getElementById('lead-contact').value) || null;
    const contact = contactId ? DB.contacts.find(c=>c.id===contactId) : null;
    DB.leads.push({
        id: genId(), name, contact_id: contactId,
        email: contact ? contact.email : '', phone: contact ? contact.phone : '',
        stage: 'new', expected_revenue: parseFloat(document.getElementById('lead-revenue').value)||0,
        probability: parseInt(document.getElementById('lead-prob').value)||20,
        notes: document.getElementById('lead-notes').value, created_at: today()
    });
    closeModal(); toast('Lead created'); renderCRM();
}

function renderPOS() {
    const sellable = DB.products.filter(p => p.type === 'product' && p.stock > 0);
    const cart = DB.posCart;
    const subtotal = cart.reduce((s,c) => s + c.price * c.qty, 0);
    const tax = subtotal * 0.08;
    const total = subtotal + tax;

    let productsHtml = sellable.map(p => `<div class="pos-product-card" onclick="addToCart(${p.id})"><div class="pos-product-icon">${p.icon}</div><div class="pos-product-name">${p.name}</div><div class="pos-product-price">${money(p.price)}</div></div>`).join('');

    let cartHtml = '';
    if (cart.length === 0) {
        cartHtml = '<div class="empty-state"><div class="icon">&#128722;</div><p>Cart is empty</p></div>';
    } else {
        cartHtml = cart.map(c => `<div class="pos-cart-item"><div class="pos-cart-item-info"><div class="pos-cart-item-name">${c.name}</div><div class="pos-cart-item-price">${money(c.price)} each</div></div><div class="pos-cart-item-qty"><button onclick="changeQty(${c.product_id},-1)">-</button><span>${c.qty}</span><button onclick="changeQty(${c.product_id},1)">+</button></div><div class="pos-cart-item-subtotal">${money(c.price*c.qty)}</div></div>`).join('');
    }

    document.getElementById('content').innerHTML = `
        <div class="page-header"><h1 class="page-title">Point of Sale</h1><div class="page-actions"><button class="btn btn-outline" onclick="clearCart()">Clear Cart</button></div></div>
        <div class="pos-layout">
            <div class="pos-products-grid">${productsHtml}</div>
            <div class="pos-cart">
                <div class="pos-cart-header">Current Order</div>
                <div class="pos-cart-items">${cartHtml}</div>
                <div class="pos-cart-footer">
                    <div class="pos-totals-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
                    <div class="pos-totals-row"><span>Tax (8%)</span><span>${money(tax)}</span></div>
                    <div class="pos-totals-row total"><span>Total</span><span>${money(total)}</span></div>
                    <div class="pos-payment-buttons">
                        <button class="btn btn-success" onclick="completePOS('cash')" ${cart.length===0?'disabled':''}>&#128181; Cash</button>
                        <button class="btn btn-primary" onclick="completePOS('card')" ${cart.length===0?'disabled':''}>&#128179; Card</button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function addToCart(productId) {
    const p = DB.products.find(x => x.id === productId);
    if (!p) return;
    const existing = DB.posCart.find(c => c.product_id === productId);
    if (existing) { existing.qty++; } else { DB.posCart.push({product_id: p.id, name: p.name, price: p.price, qty: 1}); }
    renderPOS();
}

function changeQty(productId, delta) {
    const item = DB.posCart.find(c => c.product_id === productId);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) DB.posCart = DB.posCart.filter(c => c.product_id !== productId);
    renderPOS();
}

function clearCart() { DB.posCart = []; renderPOS(); }

function completePOS(method) {
    if (DB.posCart.length === 0) return;
    const lines = DB.posCart.map(c => ({product_id: c.product_id, name: c.name, qty: c.qty, price: c.price}));
    DB.salesOrders.push({id:genId(), ref:'POS-'+String(Date.now()).slice(-4), customer_id:null, customer_name:'Walk-in Customer', date:today(), status:'delivered', lines, notes:'POS Sale - '+method.toUpperCase()});
    lines.forEach(l => { const p = DB.products.find(x=>x.id===l.product_id); if(p) p.stock = Math.max(0, p.stock - l.qty); });
    DB.posCart = [];
    toast('Payment received ('+method.toUpperCase()+')');
    renderPOS();
}

    const o = DB.manufacturingOrders.find(x=>x.id===id);

    const bom = o.bom_id ? DB.boms.find(b=>b.id===o.bom_id) : null;
    openModal('Manufacturing Order ' + o.ref, `

    `, actions);
}

function mfgTransition(id, newStatus) {
    const o = DB.manufacturingOrders.find(x=>x.id===id);

        if(newStatus==='done') {
            o.end_date = today();
            const p = DB.products.find(x=>x.id===o.product_id);
            if(p) p.stock += o.qty;

        closeModal(); toast('Manufacturing order updated'); renderManufacturing();
    }
}

function saveMfgOrder() {

    if(!p) return;
    const bom = DB.boms.find(b=>b.product_id===prodId);

}

// ACCOUNTING
// ══════════════════════════════════════════════════════════════════════════════

let accTab = 'all';

function renderAccounting() {
    const invoices = DB.invoices;
    const filtered = accTab==='all' ? invoices : invoices.filter(i=>i.type===(accTab==='customer'?'customer':'vendor'));
    const custInv = invoices.filter(i=>i.type==='customer');
    const vendInv = invoices.filter(i=>i.type==='vendor');
    const income = custInv.reduce((s,i)=>s+orderTotal(i.lines),0);
    const expenses = vendInv.reduce((s,i)=>s+orderTotal(i.lines),0);
    const receivable = custInv.filter(i=>i.status!=='paid').reduce((s,i)=>s+orderTotal(i.lines),0);
    const payable = vendInv.filter(i=>i.status!=='paid').reduce((s,i)=>s+orderTotal(i.lines),0);

    document.getElementById('content').innerHTML = `
        <div class="page-header"><h1 class="page-title">Accounting</h1><div class="page-actions"><button class="btn btn-primary" onclick="newInvoiceForm()">+ New Invoice</button></div></div>
        <div class="stats-grid">
            <div class="stat-card success"><div class="stat-label">Income</div><div class="stat-value">${money(income)}</div></div>
            <div class="stat-card danger"><div class="stat-label">Expenses</div><div class="stat-value">${money(expenses)}</div></div>
            <div class="stat-card accent"><div class="stat-label">Profit</div><div class="stat-value">${money(income-expenses)}</div></div>
            <div class="stat-card warning"><div class="stat-label">Receivable</div><div class="stat-value">${money(receivable)}</div></div>
            <div class="stat-card info"><div class="stat-label">Payable</div><div class="stat-value">${money(payable)}</div></div>
        </div>
        <div class="tabs">
            <div class="tab ${accTab==='all'?'active':''}" onclick="accTab='all';renderAccounting()">All Invoices</div>
            <div class="tab ${accTab==='customer'?'active':''}" onclick="accTab='customer';renderAccounting()">Customer Invoices</div>
            <div class="tab ${accTab==='vendor'?'active':''}" onclick="accTab='vendor';renderAccounting()">Vendor Bills</div>
        </div>
        <div class="card"><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Reference</th><th>Type</th><th>Contact</th><th>Date</th><th>Due Date</th><th>Total</th><th>Status</th></tr></thead><tbody>
            ${filtered.map(i=>`<tr onclick="viewInvoice(${i.id})"><td>${i.ref}</td><td>${i.type}</td><td>${i.contact_name}</td><td>${i.date}</td><td>${i.due_date}</td><td>${money(orderTotal(i.lines))}</td><td>${badge(i.status)}</td></tr>`).join('')}
        </tbody></table></div></div></div>
    `;
}

function viewInvoice(id) {
    const inv = DB.invoices.find(x=>x.id===id);
    if(!inv) return;
    const total = orderTotal(inv.lines);
    const linesHtml = inv.lines.map(l=>`<tr><td>${l.description}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('');
    let actions = '<button class="btn btn-outline" onclick="closeModal()">Close</button>';
    if(inv.status==='draft') actions = `<button class="btn btn-success" onclick="invoiceTransition(${inv.id},'sent')">Send</button>` + actions;
    if(inv.status==='sent') actions = `<button class="btn btn-accent" onclick="invoiceTransition(${inv.id},'paid')">Mark Paid</button>` + actions;
    openModal('Invoice ' + inv.ref, `
        <div class="detail-grid">
            <div><div class="detail-field"><div class="detail-label">Contact</div><div class="detail-value">${inv.contact_name}</div></div><div class="detail-field"><div class="detail-label">Type</div><div class="detail-value">${inv.type}</div></div></div>
            <div><div class="detail-field"><div class="detail-label">Date</div><div class="detail-value">${inv.date}</div></div><div class="detail-field"><div class="detail-label">Due Date</div><div class="detail-value">${inv.due_date}</div></div></div>
        </div>
        <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value">${badge(inv.status)}</div></div>
        <hr class="divider"><h4 class="mb-2">Lines</h4>
        <div class="table-wrapper"><table><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${linesHtml}<tr style="font-weight:700"><td colspan="3" style="text-align:right">Total</td><td>${money(total)}</td></tr></tbody></table></div>
    `, actions);
}

function invoiceTransition(id, newStatus) {
    const inv = DB.invoices.find(x=>x.id===id);
    if(inv) { inv.status = newStatus; closeModal(); toast('Invoice updated'); renderAccounting(); }
}

function newInvoiceForm() {
    const contactOpts = DB.contacts.map(c=>`<option value="${c.id}">${c.name} (${c.is_customer?'Customer':'Vendor'})</option>`).join('');
    openModal('New Invoice', `
        <div class="form-row">
            <div class="form-group"><label>Type</label><select class="form-control" id="inv-type"><option value="customer">Customer Invoice</option><option value="vendor">Vendor Bill</option></select></div>
            <div class="form-group"><label>Contact</label><select class="form-control" id="inv-contact"><option value="">Select...</option>${contactOpts}</select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Date</label><input class="form-control" id="inv-date" type="date" value="${today()}"></div>
            <div class="form-group"><label>Due Date</label><input class="form-control" id="inv-due" type="date" value="2026-04-07"></div>
        </div>
        <hr class="divider"><h4 class="mb-2">Lines</h4>
        <div id="inv-lines">
            <div class="form-row mb-2"><div class="form-group"><label>Description</label><input class="form-control inv-desc" placeholder="Description"></div><div class="form-group"><label>Qty</label><input class="form-control inv-qty" type="number" value="1"></div><div class="form-group"><label>Price</label><input class="form-control inv-price" type="number" value="0"></div></div>
        </div>
        <button class="btn btn-sm btn-outline mt-2" onclick="addInvLine()">+ Add Line</button>
    `, '<button class="btn btn-primary" onclick="saveInvoice()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function addInvLine() {
    document.getElementById('inv-lines').insertAdjacentHTML('beforeend', '<div class="form-row mb-2"><div class="form-group"><label>Description</label><input class="form-control inv-desc" placeholder="Description"></div><div class="form-group"><label>Qty</label><input class="form-control inv-qty" type="number" value="1"></div><div class="form-group"><label>Price</label><input class="form-control inv-price" type="number" value="0"></div></div>');
}

function saveInvoice() {
    const contactId = parseInt(document.getElementById('inv-contact').value);
    if (!contactId) { toast('Select a contact','error'); return; }
    const contact = DB.contacts.find(c=>c.id===contactId);
    const descs = document.querySelectorAll('.inv-desc');
    const qtys = document.querySelectorAll('.inv-qty');
    const prices = document.querySelectorAll('.inv-price');
    const lines = [];
    descs.forEach((inp,i) => { if(inp.value.trim()) lines.push({description:inp.value.trim(), qty:parseInt(qtys[i].value)||1, price:parseFloat(prices[i].value)||0}); });
    if (!lines.length) { toast('Add at least one line','error'); return; }
    DB.invoices.push({id:genId(), ref:'INV-'+String(DB.invoices.length+1).padStart(3,'0'), type:document.getElementById('inv-type').value, contact_id:contactId, contact_name:contact.name, date:document.getElementById('inv-date').value||today(), due_date:document.getElementById('inv-due').value||'', status:'draft', lines});
    closeModal(); toast('Invoice created'); renderAccounting();
}

// EMAIL MARKETING

let emailTab = 'campaigns';

function renderEmailMarketing() {
    const campaigns = DB.emailCampaigns;
    const totalSent = campaigns.reduce((s,c)=>s+c.sent,0);
    const totalOpened = campaigns.reduce((s,c)=>s+c.opened,0);
    const totalClicked = campaigns.reduce((s,c)=>s+c.clicked,0);
    const openRate = totalSent ? ((totalOpened/totalSent)*100).toFixed(1) : 0;
    const clickRate = totalSent ? ((totalClicked/totalSent)*100).toFixed(1) : 0;

    document.getElementById('content').innerHTML = `
        <div class="page-header"><h1 class="page-title">Email Marketing</h1><div class="page-actions"><button class="btn btn-primary" onclick="newEmailCampaignForm()">+ New Campaign</button></div></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Campaigns</div><div class="stat-value">${campaigns.length}</div></div>
            <div class="stat-card accent"><div class="stat-label">Emails Sent</div><div class="stat-value">${totalSent.toLocaleString()}</div></div>
            <div class="stat-card success"><div class="stat-label">Open Rate</div><div class="stat-value">${openRate}%</div></div>
            <div class="stat-card warning"><div class="stat-label">Click Rate</div><div class="stat-value">${clickRate}%</div></div>
        </div>
        <div class="tabs">
            <div class="tab ${emailTab==='campaigns'?'active':''}" onclick="emailTab='campaigns';renderEmailMarketing()">Campaigns</div>
            <div class="tab ${emailTab==='lists'?'active':''}" onclick="emailTab='lists';renderEmailMarketing()">Mailing Lists</div>
        </div>
        ${emailTab==='campaigns' ? renderEmailCampaigns(campaigns) : renderMailingLists()}
    `;
}

function renderEmailCampaigns(campaigns) {
    return `<div class="card"><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Campaign</th><th>Subject</th><th>Date</th><th>Sent</th><th>Opened</th><th>Clicked</th><th>Status</th></tr></thead><tbody>
        ${campaigns.map(c=>`<tr onclick="viewEmailCampaign(${c.id})"><td>${c.name}</td><td>${c.subject}</td><td>${c.date}</td><td>${c.sent.toLocaleString()}</td><td>${c.opened.toLocaleString()}</td><td>${c.clicked.toLocaleString()}</td><td>${badge(c.status)}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
}

function renderMailingLists() {
    return `<div class="card"><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>List Name</th><th>Subscribers</th><th>Actions</th></tr></thead><tbody>
        ${DB.mailingLists.map(ml=>`<tr><td>${ml.name}</td><td>${ml.count}</td><td><button class="btn btn-sm btn-outline" onclick="viewMailingList(${ml.id})">View</button></td></tr>`).join('')}
    </tbody></table></div></div></div>
    <div class="mt-4"><button class="btn btn-outline" onclick="newMailingListForm()">+ New Mailing List</button></div>`;
}

function viewEmailCampaign(id) {
    const c = DB.emailCampaigns.find(x=>x.id===id);
    if(!c) return;
    const openRate = c.sent ? ((c.opened/c.sent)*100).toFixed(1) : 0;
    const clickRate = c.sent ? ((c.clicked/c.sent)*100).toFixed(1) : 0;
    const list = DB.mailingLists.find(ml=>ml.id===c.list_id);
    let actions = '<button class="btn btn-outline" onclick="closeModal()">Close</button>';
    if(c.status==='scheduled') actions = `<button class="btn btn-success" onclick="sendEmailCampaign(${c.id})">Send Now</button>` + actions;
    openModal(c.name, `
        <div class="detail-grid">
            <div><div class="detail-field"><div class="detail-label">Subject</div><div class="detail-value">${c.subject}</div></div>
                <div class="detail-field"><div class="detail-label">Mailing List</div><div class="detail-value">${list?list.name:'-'}</div></div>
                <div class="detail-field"><div class="detail-label">Date</div><div class="detail-value">${c.date}</div></div></div>
            <div><div class="detail-field"><div class="detail-label">Status</div><div class="detail-value">${badge(c.status)}</div></div>
                <div class="detail-field"><div class="detail-label">Sent</div><div class="detail-value">${c.sent.toLocaleString()}</div></div>
                <div class="detail-field"><div class="detail-label">Open / Click Rate</div><div class="detail-value">${openRate}% / ${clickRate}%</div></div></div>
        </div>
    `, actions);
}

function sendEmailCampaign(id) {
    const c = DB.emailCampaigns.find(x=>x.id===id);
    if(!c) return;
    const list = DB.mailingLists.find(ml=>ml.id===c.list_id);
    c.status = 'sent';
    c.sent = list ? list.count * 150 : 500;
    c.opened = Math.floor(c.sent * 0.62);
    c.clicked = Math.floor(c.sent * 0.18);
    closeModal(); toast('Campaign sent!'); renderEmailMarketing();
}

function newEmailCampaignForm() {
    const listOpts = DB.mailingLists.map(ml=>`<option value="${ml.id}">${ml.name} (${ml.count})</option>`).join('');
    openModal('New Email Campaign', `
        <div class="form-group"><label>Campaign Name</label><input class="form-control" id="ec-name" placeholder="Campaign name"></div>
        <div class="form-group"><label>Subject Line</label><input class="form-control" id="ec-subject" placeholder="Email subject"></div>
        <div class="form-row">
            <div class="form-group"><label>Mailing List</label><select class="form-control" id="ec-list">${listOpts}</select></div>
            <div class="form-group"><label>Scheduled Date</label><input class="form-control" id="ec-date" type="date" value="${today()}"></div>
        </div>
        <div class="form-group"><label>Email Content</label><textarea class="form-control" id="ec-content" placeholder="Write your email content..."></textarea></div>
    `, '<button class="btn btn-primary" onclick="saveEmailCampaign()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function saveEmailCampaign() {
    const name = document.getElementById('ec-name').value.trim();
    if(!name) { toast('Name is required','error'); return; }
    DB.emailCampaigns.push({
        id: genId(), name, subject: document.getElementById('ec-subject').value||name,
        status: 'scheduled', sent:0, opened:0, clicked:0,
        date: document.getElementById('ec-date').value||today(),
        list_id: parseInt(document.getElementById('ec-list').value)||1
    });
    closeModal(); toast('Email campaign created'); renderEmailMarketing();
}

function viewMailingList(id) {
    const ml = DB.mailingLists.find(x=>x.id===id);
    if(!ml) return;
    const contacts = ml.contacts.map(cid => DB.contacts.find(c=>c.id===cid)).filter(Boolean);
    openModal(ml.name, `
        <div class="detail-field"><div class="detail-label">Subscribers</div><div class="detail-value">${ml.count}</div></div>
        <hr class="divider">
        <div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Company</th></tr></thead><tbody>
            ${contacts.map(c=>`<tr><td>${c.name}</td><td>${c.email}</td><td>${c.company||'-'}</td></tr>`).join('')}
        </tbody></table></div>
    `, '<button class="btn btn-outline" onclick="closeModal()">Close</button>');
}

function newMailingListForm() {
    const contactChecks = DB.contacts.filter(c=>c.opt_in_email).map(c=>`<label style="display:block;padding:4px 0"><input type="checkbox" class="ml-contact" value="${c.id}"> ${c.name} (${c.email})</label>`).join('');
    openModal('New Mailing List', `
        <div class="form-group"><label>List Name</label><input class="form-control" id="ml-name" placeholder="List name"></div>
        <div class="form-group"><label>Select Contacts</label><div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:8px">${contactChecks}</div></div>
    `, '<button class="btn btn-primary" onclick="saveMailingList()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function saveMailingList() {
    const name = document.getElementById('ml-name').value.trim();
    if(!name) { toast('Name is required','error'); return; }
    const checks = document.querySelectorAll('.ml-contact:checked');
    const contacts = Array.from(checks).map(c=>parseInt(c.value));
    DB.mailingLists.push({id:genId(), name, count:contacts.length, contacts});
    closeModal(); toast('Mailing list created'); renderEmailMarketing();
}

function renderSMSMarketing() {

function saveSMSCampaign() {

}

                <div class="detail-field"><div class="detail-label">Type</div><div class="detail-value">${c.is_customer?'Customer ':' '}${c.is_vendor?'Vendor':''}</div></div>
                <div class="detail-field"><div class="detail-label">Email Opt-in</div><div class="detail-value">${c.opt_in_email?'Yes':'No'}</div></div>
                <div class="detail-field"><div class="detail-label">SMS Opt-in</div><div class="detail-value">${c.opt_in_sms?'Yes':'No'}</div></div>
            </div>
        </div>
        ${c.notes ? '<hr class="divider"><div class="detail-field"><div class="detail-label">Notes</div><div class="detail-value">'+c.notes+'</div></div>' : ''}
    `, '<button class="btn btn-outline" onclick="closeModal()">Close</button>');
}

function newContactForm() {
    openModal('New Contact', `
        <div class="form-row">
            <div class="form-group"><label>Name</label><input class="form-control" id="ct-name" placeholder="Full name"></div>
            <div class="form-group"><label>Company</label><input class="form-control" id="ct-company" placeholder="Company"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Email</label><input class="form-control" id="ct-email" type="email" placeholder="Email"></div>
            <div class="form-group"><label>Phone</label><input class="form-control" id="ct-phone" placeholder="Phone"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>City</label><input class="form-control" id="ct-city" placeholder="City"></div>
            <div class="form-group"><label>State</label><input class="form-control" id="ct-state" placeholder="State"></div>
        </div>
        <div class="form-group"><label>Address</label><input class="form-control" id="ct-address" placeholder="Address"></div>
        <div class="form-row">
            <div class="form-group"><label><input type="checkbox" id="ct-customer" checked> Customer</label></div>
            <div class="form-group"><label><input type="checkbox" id="ct-vendor"> Vendor</label></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label><input type="checkbox" id="ct-email-opt" checked> Email Opt-in</label></div>
            <div class="form-group"><label><input type="checkbox" id="ct-sms-opt" checked> SMS Opt-in</label></div>
        </div>
        <div class="form-group"><label>Notes</label><textarea class="form-control" id="ct-notes"></textarea></div>
    `, '<button class="btn btn-primary" onclick="saveContact()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function saveContact() {
    const name = document.getElementById('ct-name').value.trim();
    if(!name) { toast('Name is required','error'); return; }
    DB.contacts.push({
        id: genId(), name,
        company: document.getElementById('ct-company').value||null,
        email: document.getElementById('ct-email').value||null,
        phone: document.getElementById('ct-phone').value||null,
        city: document.getElementById('ct-city').value||null,
        state: document.getElementById('ct-state').value||null,
        address: document.getElementById('ct-address').value||null,
        is_customer: document.getElementById('ct-customer').checked,
        is_vendor: document.getElementById('ct-vendor').checked,
        opt_in_email: document.getElementById('ct-email-opt').checked,
        opt_in_sms: document.getElementById('ct-sms-opt').checked,
        notes: document.getElementById('ct-notes').value||null
    });
    closeModal(); toast('Contact created'); renderContacts();
}

// ══════════════════════════════════════════════════════════════════════════════
// PRODUCTS
// ══════════════════════════════════════════════════════════════════════════════

let productCategoryFilter = 'All';

function renderProducts() {
    const products = DB.products;
    const categories = ['All', ...new Set(products.map(p=>p.category))];
    const filtered = productCategoryFilter==='All' ? products : products.filter(p=>p.category===productCategoryFilter);

    document.getElementById('content').innerHTML = `
        <div class="page-header"><h1 class="page-title">Products</h1><div class="page-actions"><button class="btn btn-primary" onclick="newProductForm()">+ New Product</button></div></div>
        <div class="tabs">
            ${categories.map(c=>`<div class="tab ${productCategoryFilter===c?'active':''}" onclick="productCategoryFilter='${c}';renderProducts()">${c}</div>`).join('')}
        </div>
        <div class="card"><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Cost</th><th>Stock</th></tr></thead><tbody>
            ${filtered.map(p=>`<tr onclick="viewProduct(${p.id})"><td>${p.sku}</td><td>${p.icon} ${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td></tr>`).join('')}
        </tbody></table></div></div></div>
    `;
}

function viewProduct(id) {
    const p = DB.products.find(x=>x.id===id);
    if(!p) return;
    openModal(p.name, `
        <div style="text-align:center;font-size:48px;margin-bottom:16px">${p.icon}</div>
        <div class="detail-grid">
            <div>
                <div class="detail-field"><div class="detail-label">SKU</div><div class="detail-value">${p.sku}</div></div>
                <div class="detail-field"><div class="detail-label">Category</div><div class="detail-value">${p.category}</div></div>
                <div class="detail-field"><div class="detail-label">Type</div><div class="detail-value">${p.type}</div></div>
            </div>
            <div>
                <div class="detail-field"><div class="detail-label">Sale Price</div><div class="detail-value">${money(p.price)}</div></div>
                <div class="detail-field"><div class="detail-label">Cost</div><div class="detail-value">${money(p.cost)}</div></div>
                <div class="detail-field"><div class="detail-label">On Hand</div><div class="detail-value">${p.stock}</div></div>
            </div>
        </div>
        <hr class="divider">
        <div class="detail-field"><div class="detail-label">Stock Value</div><div class="detail-value">${money(p.stock * p.cost)}</div></div>
        <div class="detail-field"><div class="detail-label">Margin</div><div class="detail-value">${((1-p.cost/p.price)*100).toFixed(1)}%</div></div>
    `, '<button class="btn btn-outline" onclick="closeModal()">Close</button>');
}

function newProductForm() {
    const cats = [...new Set(DB.products.map(p=>p.category))];
    const catOpts = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
    openModal('New Product', `
        <div class="form-row">
            <div class="form-group"><label>Product Name</label><input class="form-control" id="pd-name" placeholder="Product name"></div>
            <div class="form-group"><label>SKU</label><input class="form-control" id="pd-sku" placeholder="SKU-XXX"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Category</label><select class="form-control" id="pd-category">${catOpts}</select></div>
            <div class="form-group"><label>Type</label><select class="form-control" id="pd-type"><option value="product">Product</option><option value="raw">Raw Material</option></select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Sale Price</label><input class="form-control" id="pd-price" type="number" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>Cost</label><input class="form-control" id="pd-cost" type="number" step="0.01" placeholder="0.00"></div>
        </div>
        <div class="form-group"><label>Initial Stock</label><input class="form-control" id="pd-stock" type="number" value="0"></div>
    `, '<button class="btn btn-primary" onclick="saveProduct()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button>');
}

function saveProduct() {
    const name = document.getElementById('pd-name').value.trim();
    if(!name) { toast('Name is required','error'); return; }
    DB.products.push({
        id: genId(), name,
        sku: document.getElementById('pd-sku').value || 'PRD-'+genId(),
        category: document.getElementById('pd-category').value,
        type: document.getElementById('pd-type').value,
        price: parseFloat(document.getElementById('pd-price').value)||0,
        cost: parseFloat(document.getElementById('pd-cost').value)||0,
        stock: parseInt(document.getElementById('pd-stock').value)||0,
        icon: '&#9642;'
    });
    closeModal(); toast('Product created'); renderProducts();
}

// ── Init ────────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
    navigate('dashboard');
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
});

</script>
